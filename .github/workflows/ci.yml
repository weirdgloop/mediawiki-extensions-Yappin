name: Run CI
on: [push]

jobs:
  ci:
    strategy:
      matrix:
        include:
          - mw-branch: REL1_45
            php-version: 8.2
            experimental: false
          - mw-branch: REL1_46
            php-version: 8.3
            experimental: false

    uses: weirdgloop/ci-workflows/.github/workflows/extension-ci.yml@main
    with:
      extension-name: Yappin
      mw-branch: ${{ matrix.mw-branch }}
      php-version: ${{ matrix.php-version }}
      experimental: ${{ matrix.experimental }}
      # We don't have any unit tests yet
      phpunit: false
